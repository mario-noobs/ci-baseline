name: Claude PR Review

# Runs an automated code review when a PR carries the `claude-review` label.
# Fires on label-add and on every push to a labelled PR (synchronize/reopened).

on:
  workflow_call:

jobs:
  review:
    name: Claude review
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'claude-review') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'claude-review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Focus on:
            - Correctness and likely bugs (off-by-one, null handling, race conditions)
            - Security issues (injection, auth, secrets handling, unsafe deserialization)
            - Performance regressions and obvious inefficiencies
            - Adherence to CLAUDE.md guidelines if the file exists in the repo
            - Whether the PR actually satisfies the intent of any linked issue

            If the PR title or body references an issue (e.g. "closes #123",
            "fixes #45", "unblocks #67"), run `gh issue view <number>` to read
            that issue's description and acceptance criteria, then verify the
            diff fulfils them. Flag any AC items the diff misses.

            Post EXACTLY ONE comment in the PR conversation summarising the
            review. Do not post inline comments on individual lines.

            The comment MUST start with one of:
              "✅ No concerns found — <one-sentence rationale>"
              "⚠️ Issues found — <one-sentence rationale>"

            If issues are found, follow the headline with a short markdown
            bullet list, each bullet of the form:
              - `path/to/file.ext:LINE` — <issue + suggested fix in one line>
            or for missing AC items:
              - **AC miss (#<issue>)** — <which criterion + what's missing>

            Skip nitpicks and style-only feedback. Be concrete and brief.
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
            --max-turns ${{ vars.CLAUDE_REVIEW_MAX_TURNS || '8' }}
            --allowed-tools "Glob,Grep,LS,Read,mcp__github_comment__update_claude_comment,Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh issue list:*),Bash(gh pr list:*)"
