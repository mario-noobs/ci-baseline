name: Setup Python
description: Install Python + cache pip + install base and (optional) dev requirements.

inputs:
  python_version:
    description: Python version (passed to actions/setup-python).
    required: false
    default: "3.11"
  requirements_file:
    description: Primary requirements file (relative to working_directory).
    required: false
    default: "requirements.txt"
  dev_requirements_file:
    description: Optional second requirements file installed after the primary. Empty to skip.
    required: false
    default: ""
  working_directory:
    description: Directory containing the requirements file(s).
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python_version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ inputs.python_version }}-${{ hashFiles(format('{0}/{1}', inputs.working_directory, inputs.requirements_file), format('{0}/{1}', inputs.working_directory, inputs.dev_requirements_file)) }}
        restore-keys: |
          pip-${{ runner.os }}-${{ inputs.python_version }}-

    - name: Install base requirements
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        python -m pip install --upgrade pip
        pip install -r "${{ inputs.requirements_file }}"

    - name: Install dev requirements
      if: inputs.dev_requirements_file != ''
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: pip install -r "${{ inputs.dev_requirements_file }}"
